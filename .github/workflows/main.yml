name: CI

on:
  workflow_dispatch:

  push:
    branches: [master, experimental]
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'MergeDbg.cmd'
      - 'TestCI.cmd'
      - '.github/codeql/codeql-config.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/announcements.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/hash.yml'
      - '.github/workflows/lupdate.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/update_copyright.yml'
      - '.github/workflows/winget.yml'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
      - 'Sandboxie/msgs/report/*.txt'
      - '**/*.md'
      - '**/*.html'
      - '**/*.png'
      - '**/*.bmp'
      - '**/LICENSE*'
      - '**/license*'
      - '**/README*'
      - '**/ReadMe*'
      - '**/INSTALL*'
      - '**/AUTHORS'
      - '**/COPYING'

  pull_request:
    branches: [master, experimental]
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'MergeDbg.cmd'
      - 'TestCI.cmd'
      - '.github/codeql/codeql-config.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/announcements.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/hash.yml'
      - '.github/workflows/lupdate.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/test.yml'
      - '.github/workflows/update_copyright.yml'
      - '.github/workflows/winget.yml'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
      - 'Sandboxie/msgs/report/*.txt'
      - '**/*.md'
      - '**/*.html'
      - '**/*.png'
      - '**/*.bmp'
      - '**/LICENSE*'
      - '**/license*'
      - '**/README*'
      - '**/ReadMe*'
      - '**/INSTALL*'
      - '**/AUTHORS'
      - '**/COPYING'

jobs:
  Build_x64_Qt6:
    runs-on: windows-2022
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%
          echo qt_version=%qt6_version% >> %GITHUB_ENV%

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      #
      # Compile Sandboxie Core
      #

      - name: Build Sandboxie x86 (DLLs & svc)
        run: >
          msbuild /t:build Sandboxie\SandboxDll.sln
          /p:Configuration="SbieRelease"
          /p:Platform=Win32
          -maxcpucount:8

      - name: Build Sandboxie x64
        run: >
          msbuild /t:build Sandboxie\Sandbox.sln
          /p:Configuration="SbieRelease"
          /p:Platform=x64
          -maxcpucount:8

      - name: Build Sandboxie x64 driver
        run: >
          msbuild /t:build Sandboxie\SandboxDrv.sln
          /p:Configuration="SbieRelease"
          /p:Platform=x64
          -maxcpucount:8

      #
      # Prepare Qt
      #

      - name: Install Qt6 x64
        run: SandboxiePlus\install_qt.cmd x64

      - name: Install Jom
        run: SandboxiePlus\install_jom.cmd

      #
      # Compile Sandboxie Plus
      #

      - name: Build Sandboxie-Plus x64
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Build SbieShell x64
        run: >
          msbuild /t:restore,build
          -p:RestorePackagesConfig=true
          SandboxiePlus\SbieShell\SbieShell.sln
          /p:Configuration="Release"
          /p:Platform=x64

      #
      # Compile Sandboxie Tools
      #

      - name: Build Sandboxie-Tools x64
        run: >
          msbuild /t:build SandboxieTools\SandboxieTools.sln
          /p:Configuration="Release"
          /p:Platform=x64
          -maxcpucount:8

      #
      # Prepare installer files
      #

      - name: Add missing Qt6 languages
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get OpenSSL binaries
        run: Installer\get_openssl.cmd

      - name: Get 7-Zip binaries
        run: Installer\get_7zip.cmd

      - name: Merge build
        run: Installer\copy_build.cmd x64 build_qt6

      - name: Collect installer assets
        run: Installer\get_assets.cmd

      #
      # Install Inno Setup
      #

      - name: Install Inno Setup 6.3.3
        shell: powershell
        run: |
          $url = "https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe"
          $installer = "$env:RUNNER_TEMP\innosetup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait `
            -NoNewWindow

      - name: Verify Inno Setup
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              throw "ISCC.exe was not found: $iscc"
          }

          & $iscc /?
          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup compiler check failed with exit code $LASTEXITCODE"
          }

      #
      # Build installer
      #

      - name: Disable installer code signing
        shell: powershell
        run: |
          $source = "Installer\Sandboxie-Plus.iss"
          $target = "Installer\Sandboxie-Plus-CI.iss"

          Copy-Item $source $target -Force

          $content = Get-Content $target -Raw

          $content = $content -replace `
              '(?m)^[ \t]*SignTool[ \t]*=.*\r?\n', ''

          Set-Content `
              -Path $target `
              -Value $content `
              -Encoding UTF8

          Write-Host "Installer script prepared:"
          Write-Host $target

      - name: Build Sandboxie-Plus installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $script = "Installer\Sandboxie-Plus-CI.iss"

          & $iscc $script

          if ($LASTEXITCODE -ne 0) {
              throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      #
      # Show resulting files
      #

      - name: Find installer
        shell: powershell
        run: |
          Write-Host "=== Installer directory ==="
          Get-ChildItem "Installer" -Recurse -File |
              Where-Object {
                  $_.Extension -in ".exe", ".msi"
              } |
              Select-Object FullName, Length

      #
      # Upload artifacts
      #

      - name: Upload Sandboxie x64
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie_x64
          path: |
            Installer/SbiePlus_x64/*
          retention-days: 60

      - name: Upload Sandboxie-Plus Setup
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie-Plus-Setup-x64
          path: |
            Installer/**/*.exe
          retention-days: 60
